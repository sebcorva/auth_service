spring.application.name=auth-users
server.port=8081

# Las credenciales NO se escriben aqui: llegan por variables de entorno.
#  - Local: archivo .env en la raiz del proyecto (copiar .env.example), que se importa abajo.
#  - AWS: el despliegue las lee desde Secrets Manager y las inyecta al contenedor.
spring.config.import=optional:file:.env[.properties]

# Oracle Autonomous Database con wallet (TNS_ADMIN apunta a la carpeta de la wallet)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: el mismo secreto debe configurarse en gestor-biblioteca
jwt.secret=${JWT_SECRET}
jwt.expiracion-ms=3600000

# Admin inicial (se crea al arrancar si no existe ningun ADMIN)
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# Pago simulado
premium.precio=2000
